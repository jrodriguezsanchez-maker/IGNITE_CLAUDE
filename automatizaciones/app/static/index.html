<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Automatizaciones SAP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --bd:#d9dde3; --tx:#1d2330; --mut:#667085; --pri:#2f5bea; --ok:#1a7f4b; --warn:#b45309; --err:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--tx); }
  header { background:#1d2330; color:#fff; padding:10px 20px; display:flex; align-items:center; gap:14px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .badge.sap { background:#1a5fd1 !important; }
  #modoSel { padding:3px 6px; border-radius:6px; border:0; }
  .badge { background:#b45309; color:#fff; border-radius:10px; padding:2px 10px; font-size:12px; }
  .layout { display:grid; grid-template-columns:210px 1fr; gap:14px; padding:14px 18px; align-items:start; }
  aside, .card { background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:12px 14px; }
  .card { margin-bottom:12px; }
  h2 { font-size:14px; margin:0 0 8px; } h3 { font-size:13px; margin:12px 0 6px; }
  .stream { font-weight:600; margin:2px 0 4px; color:var(--mut); text-transform:uppercase; font-size:11px; }
  .flow { padding:7px 9px; border-radius:6px; cursor:pointer; }
  .flow:hover { background:#eef1f6; } .flow.sel { background:#e3eaff; font-weight:600; }
  .flow small { display:block; color:var(--mut); font-weight:400; font-size:12px; }
  .tabs { display:flex; gap:4px; margin-bottom:12px; border-bottom:2px solid var(--bd); }
  .tab { padding:8px 18px; cursor:pointer; border-radius:6px 6px 0 0; color:var(--mut); font-weight:600; }
  .tab.on { background:var(--card); color:var(--pri); border:1px solid var(--bd); border-bottom:2px solid var(--card); margin-bottom:-2px; }
  input[type=text], select { padding:7px 9px; border:1px solid var(--bd); border-radius:6px; font:inherit; background:#fff; }
  button { background:var(--pri); color:#fff; border:0; border-radius:6px; padding:7px 13px; font:inherit; cursor:pointer; }
  button.sec { background:#fff; color:var(--tx); border:1px solid var(--bd); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:180px; }
  .over { outline:2px dashed var(--pri); background:#f0f4ff; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:5px 7px; border-bottom:1px solid #eceff3; vertical-align:top; }
  th { background:#f1f3f7; position:sticky; top:0; z-index:1; white-space:nowrap; }
  th.app { background:#e3eaff; }
  .scroll { max-height:460px; overflow:auto; border:1px solid var(--bd); border-radius:6px; }
  .cell { max-height:4.4em; overflow:hidden; white-space:pre-line; min-width:90px; max-width:300px; }
  tr.det td { background:#fafbfd; white-space:normal; }
  .chip { display:inline-block; padding:1px 9px; border-radius:10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .FALTAN_DATOS,.NO_SOPORTADO,.SIN_REGISTRO_INFO,.ERROR_SAP { background:#fdebd0; color:var(--warn); }
  .OK,.FINALIZADA,.CONFIRMADO { background:#dcf5e7; color:var(--ok); } .PARCIAL,.SIN_STOCK,.WARN,.SIN_DATOS,.SIN_PROPUESTA { background:#fdebd0; color:var(--warn); }
  .ERROR { background:#fde2e0; color:var(--err); } .EN_CURSO,.INFO,.PROPUESTO { background:#e3eaff; color:var(--pri); }
  .msg { padding:8px 12px; border-radius:6px; background:#eef4ff; margin-top:8px; }
  .msg.err { background:#fde2e0; color:var(--err); }
  .prop { border:1px solid var(--pri); background:#f5f8ff; border-radius:8px; padding:10px 12px; margin-top:8px; }
  .log { font:12px/1.5 Consolas,monospace; background:#101521; color:#d8deea; padding:10px; border-radius:6px; max-height:240px; overflow:auto; white-space:pre-wrap; }
  .muted { color:var(--mut); } .hide { display:none !important; }
  .cards { display:flex; gap:8px; margin:6px 0 10px; flex-wrap:wrap; }
  .kpi { border:1px solid var(--bd); border-radius:8px; padding:6px 14px; min-width:100px; }
  .kpi b { font-size:20px; display:block; }
  .bar { position:sticky; bottom:0; background:#fff; border:1px solid var(--pri); border-radius:8px; padding:9px 12px; margin-top:10px; box-shadow:0 -2px 8px #0001; }
  details.cols { position:relative; } details.cols summary { cursor:pointer; padding:7px 10px; border:1px solid var(--bd); border-radius:6px; background:#fff; list-style:none; }
  details.cols .pop { position:absolute; z-index:5; background:#fff; border:1px solid var(--bd); border-radius:6px; padding:8px 12px; max-height:300px; overflow:auto; min-width:240px; box-shadow:0 4px 14px #0002; }
  details.cols label { display:block; white-space:nowrap; }
  .simul { background:#fde2e0; color:#b42318; border:2px solid #b42318; border-radius:8px; padding:10px 14px; margin-bottom:10px; font-weight:600; }
  .chipbtn { border:0; border-radius:10px; padding:2px 12px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  pre { margin:4px 0; white-space:pre-wrap; font:12px/1.4 Consolas,monospace; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
</style>
</head>
<body>
<header>
  <h1>Automatizaciones SAP · S/4HANA</h1>
  <span class="badge" id="badge">MODO SIMULADO · sin conexión a SAP</span>
  <select id="modoSel" title="Origen de los datos del chequeo. El lanzamiento sigue siendo simulado."><option value="simulado">Chequeo simulado</option><option value="sap">Chequeo con SAP real (solo lectura)</option></select>
  <button class="sec" id="btnSap" title="Comprueba, solo en lectura, si hay conexión con un sistema permitido" style="padding:3px 10px">Probar conexión SAP</button>
  <span id="sapEstado" style="font-size:12px"></span>
  <span style="margin-left:auto;color:#aab;font-size:12px">Los datos no salen de este equipo</span>
</header>
<div class="layout">
  <aside>
    <h2>Flujos</h2>
    <div id="tree" class="muted">Cargando…</div>
  </aside>
  <main>
    <div class="tabs">
      <div class="tab on" id="tabPrep">1 · Preparar y simular</div>
      <div class="tab" id="tabRes">2 · Resultados <span id="resCount" class="muted"></span></div>
    </div>

    <div id="vPrep">
      <div class="card" id="cardFile" title="Puedes arrastrar aquí un Excel">
        <div class="row">
          <h2 style="margin:0" id="flowTitle"></h2>
          <span class="muted grow" id="flowDesc"></span>
        </div>
        <div class="row" style="margin-top:8px">
          <b>Fichero</b>
          <select id="fileSel" class="grow"></select>
          <button class="sec" id="btnUpload">Subir otro Excel…</button>
          <input type="file" id="file" accept=".xlsx" class="hide">
          <button id="btnImport" class="hide">Importar escenarios</button>
          <button class="sec hide" id="btnPreview">Ver contenido</button>
          <button class="hide" id="btnRunFile">Lanzar simulación</button>
        </div>
        <div id="fileInfo" class="muted" style="margin-top:6px"></div>
        <div id="upOut"></div>
      </div>

      <div class="card" id="cardNl">
        <h2>Pídelo con tus palabras</h2>
        <div class="row">
          <input type="text" id="nl" class="grow" placeholder="Ej.: traslados en Belgium · bloqueo de stock · IG-5919 · último fichero">
          <button id="btnNl">Proponer</button>
        </div>
        <div id="nlOut"></div>
      </div>

      <div id="secSit" class="card hide">
        <h2>Escenarios</h2>
        <div id="scope" class="muted" style="margin-bottom:8px"></div>
        <div class="row" style="margin-bottom:8px">
          <input type="text" id="sitQ" class="grow" placeholder="Buscar en cualquier columna: JIRA ID, escenario, unidad, material…">
          <span id="filtros" class="row"></span>
          <select id="sitEst"><option value="">Estado: todos</option><option value="pend">Por confirmar</option><option value="ok">Confirmados</option><option value="falta">Con datos pendientes</option><option value="aviso">Con avisos</option></select>
          <details class="cols"><summary>Columnas ▾</summary><div class="pop" id="colPick"></div></details>
        </div>
        <div class="row" style="margin-bottom:6px">
          <button class="sec" id="btnSelVis">Seleccionar los visibles</button>
          <button class="sec" id="btnSelNone">Quitar selección</button>
          <span id="sitCount" class="muted"></span>
        </div>
        <div id="sitOut"></div>
        <div id="chkOut"></div>
        <div class="scroll"><table id="sitTable"></table></div>
        <div class="bar row">
          <span id="barInfo" class="grow"></span>
          <label class="muted">Cantidad por defecto <input type="text" id="qty" style="width:64px;text-align:right"></label>
          <button class="sec" id="btnChk" title="Solo lectura: no contabiliza nada">Chequear datos</button>
          <button id="btnRunSit" title="Todavía NO contabiliza en SAP: ejecuta una simulación con datos inventados">Simular lanzamiento (no contabiliza)</button>
        </div>
      </div>

      <div id="preview"></div>
    </div>

    <div id="vRes" class="hide">
      <div class="card">
        <div class="row"><h2 style="margin:0" id="runsTitle">Ejecuciones</h2>
          <label class="muted"><input type="checkbox" id="runsAll"> ver de todos los flujos</label></div>
        <div id="runs" class="muted" style="margin-top:8px">Sin ejecuciones todavía.</div>
      </div>
      <div class="card hide" id="secDetail">
        <div id="detAviso"></div>
        <h2 id="detTitle"></h2>
        <div id="detSum" class="cards"></div>
        <div class="row" id="detTabs" style="margin-bottom:8px"></div>
        <div class="row" style="margin-bottom:8px"><button class="sec" id="btnCsv">Descargar esta vista (CSV)</button><span class="muted" id="detNote"></span></div>
        <div class="scroll"><table id="detTable"></table></div>
        <h3>Log</h3>
        <div class="log" id="detLog"></div>
      </div>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
